<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Cleaning History</h1>

    <table class="table">

        <tr>
            <th>ID</th>
            <th>File Name</th>
            <th>Upload Date</th>
            <th>Cleaning Operation</th>
            <th>Final Row Count</th>
        </tr>

        {% for row in history %}

        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <form method="POST">
        <button type="submit">
            Clear History
        </button>
    </form>

    <br>

    <a href="/">
        <button type="button">
            Back to Home
        </button>
    </a>

</div>

</body>
</html>
